version: "3.9"

services:
  server:
    build:
      context: .
    volumes:
      - db_data_sqlite:/var/lib/kutt
    environment:
      - DB_CLIENT=better-sqlite3
      - DB_FILENAME=/var/lib/kutt/data.sqlite
      - REDIS_ENABLED=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - 3000:3000
    depends_on:
      redis:
        condition: service_started
    restart: always

  redis:
    image: redis:alpine
    restart: always
    expose:
      - 6379

volumes:
  db_data_sqlite:
